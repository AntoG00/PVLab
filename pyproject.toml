[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "pv-lab"
version = "0.1.0"
description = "Source-available local Italy-only household energy scenario calculator"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.3",
  "numba==0.68.0",
  "scipy==1.18.1",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1", "pytest-xdist==3.8.0", "execnet==2.1.2",
  "hatchling==1.33.0", "pip-audit==2.10.1",
]
legacy = ["rasterio==1.5.2"]

[tool.hatch.build.targets.wheel]
only-include = [
  "feasibility/api.py",
  "feasibility/assumptions.py",
  "feasibility/build_report.py",
  "feasibility/consumption_ingest.py",
  "feasibility/dataset_compile.py",
  "feasibility/engine.py",
