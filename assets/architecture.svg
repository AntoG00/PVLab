<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540">
  <style>
    .node {
      fill: none;
      stroke: #64748b;
      stroke-width: 1.75;
      rx: 8;
      ry: 8;
    }
    .accent {
      fill: none;
      stroke: #0ea5e9;
      stroke-width: 2;
      rx: 8;
      ry: 8;
    }
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #1e293b;
      text-anchor: middle;
    }
    .sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      fill: #0284c7;
      text-anchor: middle;
    }
    .edge {
      fill: none;
      stroke: #64748b;
      stroke-width: 1.75;
      marker-end: url(#arrow);
    }

  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Row 1: Server Initialization -->
  <rect class="node" x="20" y="25" width="190" height="60" />
  <text class="title" x="115" y="50">Server Startup</text>
  <text class="sub" x="115" y="68">run.sh / server.py</text>

  <path class="edge" d="M 210 55 L 240 55" />

  <rect class="node" x="240" y="25" width="190" height="60" />
  <text class="title" x="335" y="50">Storage Init</text>
  <text class="sub" x="335" y="68">ProfileStore &amp; TenantStore</text>

  <path class="edge" d="M 430 55 L 460 55" />

  <rect class="node" x="460" y="25" width="180" height="60" />
  <text class="title" x="550" y="50">WorkerPool Spawn</text>
  <text class="sub" x="550" y="68">2 workers</text>

  <path class="edge" d="M 640 55 L 670 55" />

  <rect class="accent" x="670" y="25" width="190" height="60" />
  <text class="title" x="765" y="50">FeasibilityServer Listen</text>
  <text class="sub" x="765" y="68">127.0.0.1:8000</text>

  <!-- Connector Row 1 to Row 2 -->
  <path class="edge" d="M 765 85 L 765 135" />

  <!-- Row 2: Client &amp; Onboarding (Right to Left) -->
  <rect class="node" x="670" y="135" width="190" height="60" />
  <text class="title" x="765" y="160">Browser Client Connects</text>
  <text class="sub" x="765" y="178">index.html</text>

  <path class="edge" d="M 670 165 L 640 165" />

  <rect class="node" x="460" y="135" width="180" height="60" />
  <text class="title" x="550" y="160">Session Cookie Issued</text>
  <text class="sub" x="550" y="178">pv_session</text>

  <path class="edge" d="M 460 165 L 430 165" />

  <rect class="node" x="240" y="135" width="190" height="60" />
  <text class="title" x="335" y="160">Onboarding UI</text>
  <text class="sub" x="335" y="178">onboarding.js</text>

  <path class="edge" d="M 240 165 L 210 165" />

  <rect class="node" x="20" y="135" width="190" height="60" />
  <text class="title" x="115" y="160">Rooftop &amp; CSV Ingest</text>
  <text class="sub" x="115" y="178">consumption-csv.js</text>

  <!-- Connector Row 2 to Row 3 -->
  <path class="edge" d="M 115 195 L 115 245" />

  <!-- Row 3: Data Fetch &amp; Simulation Engine (Left to Right) -->
  <rect class="node" x="20" y="245" width="190" height="60" />
  <text class="title" x="115" y="270">Solar/Weather Fetch</text>
  <text class="sub" x="115" y="288">PVGIS 6 / Open-Meteo</text>

  <path class="edge" d="M 210 275 L 240 275" />

  <rect class="accent" x="240" y="245" width="190" height="60" />
  <text class="title" x="335" y="270">Simulation Dispatch</text>
  <text class="sub" x="335" y="283"><tspan x="335">engine.py</tspan><tspan x="335" dy="13">physical_dispatch.py</tspan></text>

  <path class="edge" d="M 430 275 L 460 275" />

  <rect class="accent" x="460" y="245" width="180" height="60" />
  <text class="title" x="550" y="270">Heat Pump Modeling</text>
  <text class="sub" x="550" y="283"><tspan x="550">heatpump.py</tspan><tspan x="550" dy="13">heatpump_tank.py</tspan></text>

  <path class="edge" d="M 640 275 L 670 275" />

  <rect class="accent" x="670" y="245" width="190" height="60" />
  <text class="title" x="765" y="270">Fiscal &amp; Loan Calculations</text>
  <text class="sub" x="765" y="288">fiscal_it.py / gas_taxes.py</text>

  <!-- Connector Row 3 to Row 4 -->
  <path class="edge" d="M 765 305 L 765 355 L 440 355 L 440 385" />

  <!-- Row 4: Interactive Presentation -->
  <rect class="accent" x="140" y="385" width="600" height="120" />
  <text class="title" x="440" y="412">Interactive Presentation (6 Canonical Views in app.js)</text>

  <rect class="node" x="160" y="430" width="82" height="55" />
  <text class="sub" x="201" y="462">Summary</text>

  <rect class="node" x="255" y="430" width="95" height="55" />
  <text class="sub" x="302" y="462">System Design</text>

  <rect class="node" x="363" y="430" width="82" height="55" />
  <text class="sub" x="404" y="462">Financing</text>

  <rect class="node" x="458" y="430" width="82" height="55" />
  <text class="sub" x="499" y="462">Behavior</text>

  <rect class="node" x="553" y="430" width="75" height="55" />
  <text class="sub" x="590" y="462">Prices</text>

  <rect class="node" x="641" y="430" width="82" height="55" />
  <text class="sub" x="682" y="462">Assumptions</text>
</svg>
