name: Offline synthetic package and dependency checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install hash-locked dependencies and reviewed package
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Check environment and explicit export inventory
        run: |
          python tools/check_public_plan.py --mode public --check-environment
          python -c "import sys; sys.path.insert(0, 'tools'); from check_public_plan import export_files; print(len(export_files()), 'reviewed export paths')"
      - name: Full offline Python, Node, acceptance, privacy and exact reference
        run: python tools/check_public_plan.py --mode public --workers 1
      - name: Audit every dependency lock without advisory exemptions
        run: |
          python -m pip_audit --require-hashes --no-deps --disable-pip -r requirements.lock
          python -m pip_audit --require-hashes --no-deps --disable-pip -r requirements-build.lock
          python -m pip_audit --require-hashes --no-deps --disable-pip -r requirements-dev.lock
          python -m pip_audit --require-hashes --no-deps --disable-pip -r requirements-legacy.lock
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install hash-locked dependencies and reviewed package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation .
      - name: Production launcher startup
        run: |
          bash feasibility/run.sh --port 8765 &
          launcher_pid=$!
          trap 'kill "$launcher_pid" 2>/dev/null || true; wait "$launcher_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 1 --max-time 2 http://127.0.0.1:8765/api/health
          kill -0 "$launcher_pid"
      - name: End-to-end offline synthetic calculation and worker cancellation
        run: |
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          .venv/bin/python -m pytest -v \
            tests/test_worker_pool.py::test_real_spawn_interleaves_distinct_owned_arrays_and_immutable_revision \
            'tests/test_worker_pool.py::test_worker_termination_failure_and_deletion[cancel]' \
            'tests/test_worker_pool.py::test_worker_termination_failure_and_deletion[memory]'
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.16'
          architecture: 'x64'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Install and verify Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install git --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "choco install git failed with exit code $LASTEXITCODE" }
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
              $env:PATH = "C:\Program Files\Git\cmd;$env:PATH"
              echo "C:\Program Files\Git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          git --version
          if ($LASTEXITCODE -ne 0) { throw "git --version failed with exit code $LASTEXITCODE" }
      - name: Export clean checkout to path with spaces and non-ASCII characters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # Keep household/test data under the runner user's ACL-protected profile.
          $testTemp = Join-Path $env:LOCALAPPDATA "pv-lab-ci-temp"
          New-Item -ItemType Directory -Force -Path $testTemp
          "TEMP=$testTemp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMPDIR=$testTemp" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $dest = Join-Path $env:RUNNER_TEMP "pv lab àé"
          $zipPath = Join-Path $env:RUNNER_TEMP "repo.zip"
          New-Item -ItemType Directory -Force -Path $dest
          git archive --format=zip HEAD -o $zipPath
          if ($LASTEXITCODE -ne 0) { throw "git archive failed with exit code $LASTEXITCODE" }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $dest -Force
          Remove-Item -Force $zipPath
      - name: Install hash-locked dev dependencies and package in fresh venv
        working-directory: ${{ runner.temp }}/pv lab àé
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "python -m venv failed with exit code $LASTEXITCODE" }
          .venv\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "pip install requirements-dev.lock failed with exit code $LASTEXITCODE" }
          .venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { throw "pip install package failed with exit code $LASTEXITCODE" }
          .venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed with exit code $LASTEXITCODE" }
      - name: Run full pytest test suite
        working-directory: ${{ runner.temp }}/pv lab àé
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pytestTemp = Join-Path $env:TEMP "pytest-basetemp"
          New-Item -ItemType Directory -Force -Path $pytestTemp
          $env:TMPDIR = $pytestTemp
          $env:NUMBA_NUM_THREADS = "2"
          $env:OPENBLAS_NUM_THREADS = "1"
          $env:OMP_NUM_THREADS = "1"
          $env:MKL_NUM_THREADS = "1"
          $env:NUMEXPR_NUM_THREADS = "1"
          $cores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfCores -Sum).Sum
          if ($cores -lt 2) { throw "At least 2 physical cores required (found $cores); cannot reserve a core" }
          $workers = 2 * ($cores - 1)
          Write-Host "PV_TEST_WORKERS: $workers ($cores physical cores)"
          "PV_TEST_WORKERS=$workers" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          .venv\Scripts\python.exe -m pytest -q -n $workers --dist=worksteal --tb=short --basetemp="$pytestTemp" tests
          if ($LASTEXITCODE -ne 0) { throw "pytest failed with exit code $LASTEXITCODE" }
      - name: Run full Node test suite
        working-directory: ${{ runner.temp }}/pv lab àé
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PV_PYTHON = (Resolve-Path ".venv\Scripts\python.exe").Path
          $nodeTests = Get-ChildItem -Path "tests\test_*.js" | Select-Object -ExpandProperty FullName
          node --test --test-concurrency=$env:PV_TEST_WORKERS $nodeTests
          if ($LASTEXITCODE -ne 0) { throw "Node test runner failed with exit code $LASTEXITCODE" }
      - name: Run Windows release smoke harness
        working-directory: ${{ runner.temp }}/pv lab àé
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .venv\Scripts\python.exe tools\windows_release_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "windows_release_smoke.py failed with exit code $LASTEXITCODE" }
